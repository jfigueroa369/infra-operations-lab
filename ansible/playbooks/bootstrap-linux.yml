---
- name: Preparar un host Linux de laboratorio
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Instalar utilidades mínimas de operación
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
          - git
          - unzip
        state: present

    - name: Crear directorio para respaldos de laboratorio
      ansible.builtin.file:
        path: /opt/infra-operations-lab/backups
        state: directory
        owner: root
        group: root
        mode: "0750"

